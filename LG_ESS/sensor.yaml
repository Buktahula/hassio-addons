###############################################################################
#                                                                             #
#                       LG ESS Home Assistant Sensoren                        #
#                                                                             #
#  Einbindung in configuration.yaml:                                          #
#  template: !include sensor.yaml                                             #
#                                                                             #
###############################################################################

- sensor:
    # =========================================================================
    # ⚡ AKTUELLE LEISTUNGSWERTE (kW / W) - Für Live-Karten & Power Flow
    # =========================================================================

    - name: "Aktuelle Netzeinspeisung"
      unique_id: lgess_actual_grid_sell
      unit_of_measurement: "kW"
      device_class: power
      state_class: measurement
      state: >
        {% if is_state('sensor.ess_ess_home_direction_is_grid_selling', '1') %}
          {{ (states('sensor.ess_ess_common_grid_active_power') | float(0) * 0.001) | round(3) }}
        {% else %}
          0.0
        {% endif %}

    - name: "Aktueller Netzbezug"
      unique_id: lgess_actual_grid_buy
      unit_of_measurement: "kW"
      device_class: power
      state_class: measurement
      state: >
        {% if is_state('sensor.ess_ess_home_direction_is_grid_buying', '1') %}
          {{ (states('sensor.ess_ess_common_grid_active_power') | float(0) * 0.001) | round(3) }}
        {% else %}
          0.0
        {% endif %}

    - name: "Aktuelle Batterieladung"
      unique_id: lgess_actual_battery_charge
      unit_of_measurement: "kW"
      device_class: power
      state_class: measurement
      state: >
        {% if is_state('sensor.ess_ess_home_direction_is_battery_charging', '1') %}
          {{ (states('sensor.ess_ess_common_batt_dc_power') | float(0) * 0.001) | round(3) }}
        {% else %}
          0.0
        {% endif %}

    - name: "Aktuelle Batterientladung"
      unique_id: lgess_actual_battery_discharge
      unit_of_measurement: "kW"
      device_class: power
      state_class: measurement
      state: >
        {% if is_state('sensor.ess_ess_home_direction_is_battery_discharging', '1') %}
          {{ (states('sensor.ess_ess_common_batt_dc_power') | float(0) * 0.001) | round(3) }}
        {% else %}
          0.0
        {% endif %}

    - name: "Aktuelle PV-Erzeugung Gesamt"
      unique_id: lgess_actual_generation_pv_full
      unit_of_measurement: "kW"
      device_class: power
      state_class: measurement
      state: "{{ (states('sensor.ess_ess_home_statistics_pcs_pv_total_power') | float(0) * 0.001) | round(3) }}"

    - name: "Aktuelle PV-Erzeugung String 1"
      unique_id: lgess_actual_generation_pv_1
      unit_of_measurement: "kW"
      device_class: power
      state_class: measurement
      state: "{{ (states('sensor.ess_ess_common_pv_pv1_power') | float(0) * 0.001) | round(3) }}"

    - name: "Aktuelle PV-Erzeugung String 2"
      unique_id: lgess_actual_generation_pv_2
      unit_of_measurement: "kW"
      device_class: power
      state_class: measurement
      state: "{{ (states('sensor.ess_ess_common_pv_pv2_power') | float(0) * 0.001) | round(3) }}"

    - name: "Aktueller Hausverbrauch"
      unique_id: lgess_actual_consuming_house
      unit_of_measurement: "kW"
      device_class: power
      state_class: measurement
      state: "{{ (states('sensor.ess_ess_common_load_load_power') | float(0) * 0.001) | round(3) }}"


    # =========================================================================
    # 📊 ENERGIEWERTE (kWh) - Für das offizielle Home Assistant ENERGIE-DASHBOARD
    # =========================================================================

    # In HA Energie-Dashboard unter: "Netzverbrauch" -> "Netzbezug hinzufügen"
    - name: "Tagesnetzbezug"
      unique_id: lgess_daily_grid_buy
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing
      state: "{{ (states('sensor.ess_ess_common_GRID_today_grid_power_purchase_energy') | float(0) * 0.001) | round(2) }}"

    # In HA Energie-Dashboard unter: "Netzverbrauch" -> "Rückeinspeisung hinzufügen"
    - name: "Tagesnetzeinspeisung"
      unique_id: lgess_energy_sell_today
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing
      state: "{{ (states('sensor.ess_ess_home_statistics_current_grid_feed_in_energy') | float(0) * 0.001) | round(2) }}"

    # In HA Energie-Dashboard unter: "Sonnenkollektoren" -> "Solarproduktion hinzufügen"
    - name: "Tages-Solarerzeugung"
      unique_id: lgess_energy_generation_today
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing
      state: "{{ (states('sensor.ess_ess_home_statistics_current_pv_generation_sum') | float(0) * 0.001) | round(2) }}"

    # In HA Energie-Dashboard unter: "Batteriesysteme" -> "In Batterie geladene Energie"
    - name: "Tages-Batterieladung"
      unique_id: lgess_energy_batt_charge_today
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing
      state: "{{ (states('sensor.ess_ess_common_BATT_today_batt_charge_energy') | float(0) * 0.001) | round(2) }}"

    # In HA Energie-Dashboard unter: "Batteriesysteme" -> "Aus Batterie entnommene Energie"
    - name: "Tages-Batterieentladung"
      unique_id: lgess_energy_batt_discharge_today
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing
      state: "{{ (states('sensor.ess_ess_common_BATT_today_batt_discharge_enery') | float(0) * 0.001) | round(2) }}"

    # Hausverbrauch kumuliert (kWh)
    - name: "Tages-Hausverbrauch Gesamt"
      unique_id: lgess_daily_verbrauch_gesamt
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing
      state: "{{ (states('sensor.ess_ess_common_LOAD_today_load_consumption_sum') | float(0) * 0.001) | round(2) }}"


    # =========================================================================
    # 🔋 BATTERIE & STATUS
    # =========================================================================

    - name: "Batterie Ladestand"
      unique_id: lgess_battery_load_percent
      unit_of_measurement: "%"
      device_class: battery
      state_class: measurement
      state: "{{ states('sensor.ess_ess_common_batt_soc') | float(0) | round(0) }}"

    - name: "Eigenverbrauchsrate (heute)"
      unique_id: lgess_energy_day_self_consumption_rate
      unit_of_measurement: "%"
      state_class: measurement
      state: "{{ states('sensor.ess_ess_home_statistics_current_day_self_consumption') | float(0) | round(1) }}"

    # Autarkiegrad mit Null-Divisionsschutz
    - name: "Autarkie-Grad (heute)"
      unique_id: lgess_calculated_self_sufficiency
      unit_of_measurement: "%"
      state_class: measurement
      state: >-
        {% set load = states('sensor.ess_ess_common_LOAD_today_load_consumption_sum') | float(0) %}
        {% set grid = states('sensor.ess_ess_common_GRID_today_grid_power_purchase_energy') | float(0) %}
        {% if load > 0 %}
          {{ [0, [100, 100 - (grid * 100 / load)] | min] | max | round(1) }}
        {% else %}
          100
        {% endif %}
